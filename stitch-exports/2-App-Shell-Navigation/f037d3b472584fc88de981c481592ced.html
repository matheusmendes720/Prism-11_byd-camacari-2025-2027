<!DOCTYPE html>

<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter"],
            },
            borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          },
        },
      };

<div class="flex items-center gap-3">
<svg class="h-8 w-8 text-primary" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<nav class="flex items-center gap-4">

<a class="text-sm font-medium text-primary" href="#">Knowledge Map</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-primary" href="#">Journal</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-primary" href="#">Community</a>

</div>
<div class="flex items-center gap-4">

<input class="w-full rounded bg-gray-100 dark:bg-gray-800 border-transparent focus:border-primary focus:ring-primary pl-10 pr-4 py-2 text-sm" placeholder="Search" type="search"/>

<button class="relative rounded-full p-2 hover:bg-gray-100 dark:hover:bg-gray-800">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-400">notifications</span>
</button>

<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-300">search</span>

<button class="flex items-center justify-center p-2 text-white hover:bg-white/10 dark:hover:bg-black/10 rounded-t-lg">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex items-center justify-center p-2 text-white hover:bg-white/10 dark:hover:bg-black/10 rounded-b-lg">
<span class="material-symbols-outlined">remove</span>
</button>

<button class="flex h-10 w-10 items-center justify-center rounded-lg bg-white/20 dark:bg-black/20 backdrop-blur-sm text-white shadow-lg hover:bg-white/10 dark:hover:bg-black/10">

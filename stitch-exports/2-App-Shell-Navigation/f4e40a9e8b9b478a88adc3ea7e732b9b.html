<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<title>Dream Logger</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col h-screen">
<header class="flex items-center justify-between w-full px-6 py-3 border-b border-black/10 dark:border-white/10 shrink-0">
<div class="flex items-center gap-3">
<svg class="text-black dark:text-white" fill="none" height="24" viewBox="0 0 48 48" width="24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
<h1 class="text-lg font-bold text-black dark:text-white">Dream Logger</h1>
</div>
<div class="relative w-full max-w-sm">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-black/50 dark:text-white/50">search</span>
<input class="w-full pl-10 pr-4 py-2 text-sm bg-black/5 dark:bg-white/5 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-black dark:text-white placeholder-black/50 dark:placeholder-white/50" placeholder="Quick search..." type="search"/>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 text-black dark:text-white">
<span class="material-symbols-outlined">auto_awesome</span>
</button>
<div class="relative">
<button class="flex items-center gap-2" id="profile-menu-button">
<img alt="User avatar" class="w-8 h-8 rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUEzrI9WwVmXBTWtc0BzWr6prggDgSDINRHBUGLN3v8AcMtAzzUbqcKpfOhPzS5MMfwucFaN9fAJvYolRG1FFE_womMG3IeR8KjSCbL8e42wFpUA7tIsewe82R8N9_-5TsGRATzyFxDHrfXKUvF92BlqPizWCRIHfP1aXolevQYvlsh5XFp4xfouQNHeE2Q3MdgEBBc_nw-7eaDbj_dgMqZDuW_Gitp5eX7SZQSJw_skLNDOPlT4m6wcm-1L-cwitpWTITnRs0i3YO"/>
</button>
<div class="absolute right-0 mt-2 w-48 bg-background-light dark:bg-background-dark border border-black/10 dark:border-white/10 rounded-lg shadow-lg hidden" id="profile-menu">
<a class="block px-4 py-2 text-sm text-black dark:text-white hover:bg-black/5 dark:hover:bg-white/5" href="#">Profile</a>
<a class="block px-4 py-2 text-sm text-black dark:text-white hover:bg-black/5 dark:hover:bg-white/5" href="#">Settings</a>
<hr class="border-black/10 dark:border-white/10"/>
<a class="block px-4 py-2 text-sm text-black dark:text-white hover:bg-black/5 dark:hover:bg-white/5" href="#">Logout</a>
</div>
</div>
</div>
</header>
<main class="flex-1">
</main>
</div>
<script>
      const profileMenuButton = document.getElementById('profile-menu-button');
      const profileMenu = document.getElementById('profile-menu');
      profileMenuButton.addEventListener('click', () => {
        profileMenu.classList.toggle('hidden');
      });
      document.addEventListener('click', (event) => {
        if (!profileMenuButton.contains(event.target) && !profileMenu.contains(event.target)) {
          profileMenu.classList.add('hidden');
        }
      });
    </script>

</body></html>
